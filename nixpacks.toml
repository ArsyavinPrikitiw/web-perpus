[phases.setup]
nixPkgs = ['php84', 'php84Packages.composer', 'nodejs_22']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader --no-interaction',
    'npm install'
]

[phases.build]
cmds = [
    'npm run build'
]

[variables]
NIXPACKS_PHP_ROOT_DIR = '/app/public'

[start]
cmd = 'sh ./docker/entrypoint.sh frankenphp run --config /app/Caddyfile'
